# ============================================================
#  Moderasyon Botu ayarları
#  Sadece token'ı doldurman yeterli. Kanallar, YouTube, destek
#  sistemi gibi her şey Discord'dan ! komutlarıyla ayarlanır.
# ============================================================

# Discord Developer Portal > Uygulaman > Bot > Reset Token
# Bu token şifre gibidir, kimseyle paylaşma!
token=

# Komut ön eki
onek=!

# Komutları kullanabilecek ek kişiler (Discord kullanıcı ID'leri, virgülle).
# Boş bırakırsan sadece botun sahibi (Developer Portal'daki hesap) kullanır.
sahip.id=

# Botun durum yazısında bilgileri gösterilecek YouTube kanalı
# (son video, abone sayısı... sırayla döner). Boş bırakırsan sadece !yardim yazar.
durum.youtube=
# Durum yazısı kaç saniyede bir değişsin
durum.saniye=30

# Kaç uyarıda otomatik susturulsun (0 = kapalı) ve ne kadar süre
uyari.limit=3
uyari.ceza=1h

# Kaç dakikada bir yeni YouTube videosu kontrol edilsin
youtube.kontrol.dakika=5

# Kick yayın bildirimi (!yayin komutu). Resmi Kick API'si için (önerilir, engellenmez):
# kick.com > Ayarlar > Developer > Create App ile alınan Client ID ve Client Secret.
# Boş bırakırsan bot Kick'in sitesini doğrudan okumayı dener (Kick bazen engeller).
kick.client.id=
kick.client.secret=
# Kaç saniyede bir yayın kontrol edilsin
kick.kontrol.saniye=120

# Discord'a DNS engeli varsa (Türkiye'de var) adresleri Cloudflare'in
# şifreli DNS'inden sorar. Sadece botu etkiler.
dns.sifreli=true
