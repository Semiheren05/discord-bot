name: Derleme

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Botu derle
        run: ./gradlew botJar --no-daemon

      - name: Jar dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: ModBot
          path: build/libs/ModBot.jar
